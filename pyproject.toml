[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fdcf"
version = "0.1.0"
description = "Financial Data Continuity Framework: verify financial records across ERP migrations"
authors = [{name = "Elizabeth Umah"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "pyyaml>=6.0", "matplotlib>=3.7", "tabulate>=0.9"]

[tool.setuptools]
packages = ["fdcf"]
